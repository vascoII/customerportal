security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  role_hierarchy:
    ROLE_OCCUPANT: ROLE_USER
    ROLE_GESTIONNAIRE: ROLE_USER
    ROLE_ADMIN: [ROLE_GESTIONNAIRE]
    ROLE_MAISONMERE: [ROLE_ADMIN]
    ROLE_AGENCE: [ROLE_ADMIN]
    ROLE_SYNDICAT: [ROLE_ADMIN]

  providers:
    user_provider:
      id: App\Security\Authentication\Provider\UserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # API firewall - allow OPTIONS requests without authentication
    # In faker mode, disable security for API routes (controllers will handle fake data)
    api:
      pattern: ^/api
      stateless: false
      lazy: true
      # Temporarily disable security for API routes in faker mode
      # TODO: Re-enable proper authentication when not in faker mode
      security: false
      provider: user_provider
      custom_authenticators:
        - App\Security\ApiHeaderAuthenticator
        - App\Security\AppCustomAuthenticator

    front_area:
      lazy: true
      provider: user_provider
      form_login:
        login_path: /login
        check_path: /login_check
      custom_authenticators:
        - App\Security\AppCustomAuthenticator
      logout:
        path: /logout

  access_control:
    # Allow OPTIONS requests for CORS preflight (must be first)
    - { path: ^/api, methods: [OPTIONS], roles: PUBLIC_ACCESS }
    # Allow API security endpoints (login, logout) without authentication
    - { path: ^/api/security/(login|logout), roles: PUBLIC_ACCESS }
    # In faker mode, allow all API routes without authentication
    # The controllers will check faker mode and return fake data
    - { path: ^/api, roles: PUBLIC_ACCESS }
    - {
        path: ^/(login|logout|login_check|reset-password|create|reset-or-create),
        roles: PUBLIC_ACCESS,
      }
    - { path: ^/(reporttoken|document/receive), roles: PUBLIC_ACCESS }
    - { path: ^/(en|fr)/(legal-notices|personal-datas), roles: PUBLIC_ACCESS }
    - { path: ^/(en|fr)/change/locale/(en|fr), roles: PUBLIC_ACCESS }
    - {
        path: ^/(en|fr)/(update-password|cgu),
        roles: [ROLE_OCCUPANT, ROLE_GESTIONNAIRE],
      }
    - {
        path: ^/(en|fr)/depannage/.+/releve,
        roles: [ROLE_OCCUPANT, ROLE_GESTIONNAIRE],
      }
    - {
        path: ^/(en|fr)/occupant/.+/releve,
        roles: [ROLE_OCCUPANT, ROLE_GESTIONNAIRE],
      }
    - { path: ^/(en|fr)/occupant, roles: [ROLE_OCCUPANT] }
    - {
        path: ^/(en|fr)/guide,
        roles: [ROLE_USER, ROLE_GESTIONNAIRE, ROLE_ADMIN],
      }
    - { path: ^/.+, roles: [ROLE_GESTIONNAIRE] }
